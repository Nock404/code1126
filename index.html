const LAWS = {"道路交通安全法": {"8": "国家对机动车实行登记制度。机动车经公安机关交通管理部门登记后，方可上道路行驶。尚未登记的机动车，需要临时上道路行驶的，应当取得临时通行牌证。", "11": "驾驶机动车上道路行驶，应当悬挂机动车号牌，放置检验合格标志、保险标志，并随车携带机动车行驶证。\n机动车号牌应当按照规定悬挂并保持清晰、完整，不得故意遮挡、污损。\n任何单位和个人不得收缴、扣留机动车号牌。", "13": "对登记后上道路行驶的机动车，应当依照法律、行政法规的规定，根据车辆用途、载客载货数量、使用年限等不同情况，定期进行安全技术检验。对提供机动车行驶证和机动车第三者责任强制保险单的，机动车安全技术检验机构应当予以检验，任何单位不得附加其他条件。对符合机动车国家安全技术标准的，公安机关交通管理部门应当发给检验合格标志。\n对机动车的安全技术检验实行社会化。具体办法由国务院规定。", "14": "国家实行机动车强制报废制度，根据机动车的安全技术状况和不同用途，规定不同的报废标准。\n应当报废的机动车必须及时办理注销登记。\n达到报废标准的机动车不得上道路行驶。报废的大型客、货车及其他营运车辆应当在公安机关交通管理部门的监督下解体。", "15": "警车、消防车、救护车、工程救险车应当按照规定喷涂标志图案，安装警报器、标志灯具。其他机动车不得喷涂、安装、使用上述车辆专用的或者与其相类似的标志图案、警报器或者标志灯具。\n警车、消防车、救护车、工程救险车应当严格按照规定的用途和条件使用。", "16": "任何单位或者个人不得有下列行为：\n（一）拼装机动车或者擅自改变机动车已登记的结构、构造或者特征；\n（二）改变机动车型号、发动机号、车架号或者车辆识别代号；\n（三）伪造、变造或者使用伪造、变造的机动车登记证书、号牌、行驶证、检验合格标志、保险标志；\n（四）使用其他机动车的登记证书、号牌、行驶证、检验合格标志、保险标志。", "17": "国家实行机动车第三者责任强制保险制度，设立道路交通事故社会救助基金。具体办法由国务院规定。", "18": "依法应当登记的非机动车，经公安机关交通管理部门登记后，方可上道路行驶。\n依法应当登记的非机动车的种类，由省、自治区、直辖市人民政府根据当地实际情况规定。\n非机动车的外形尺寸、质量、制动器、车铃和夜间反光装置，应当符合非机动车安全技术标准。", "19": "驾驶机动车，应当依法取得机动车驾驶证。\n申请机动车驾驶证，应当符合国务院公安部门规定的驾驶许可条件；经考试合格后，由公安机关交通管理部门发给相应类别的机动车驾驶证。\n驾驶人应当按照驾驶证载明的准驾车型驾驶机动车；驾驶机动车时，应当随身携带机动车驾驶证。\n公安机关交通管理部门以外的任何单位或者个人，不得收缴、扣留机动车驾驶证。", "21": "驾驶人驾驶机动车上道路行驶前，应当对机动车的安全技术性能进行认真检查；不得驾驶安全设施不全或者机件不符合技术标准等具有安全隐患的机动车。", "22": "机动车驾驶人应当遵守道路交通安全法律、法规的规定，按照操作规范安全驾驶、文明驾驶。\n饮酒、服用国家管制的精神药品或者麻醉药品，或者患有妨碍安全驾驶机动车的疾病，或者过度疲劳影响安全驾驶的，不得驾驶机动车。\n任何人不得强迫、指使、纵容驾驶人违反道路交通安全法律、法规和机动车安全驾驶要求驾驶机动车。", "28": "任何单位和个人不得擅自设置、移动、占用、损毁交通信号灯、交通标志、交通标线。\n道路两侧及隔离带上种植的树木或者其他植物，设置的广告牌、管线等，应当与交通设施保持必要的距离，不得遮挡路灯、交通信号灯、交通标志，不得妨碍安全视距，不得影响通行。", "31": "未经许可，任何单位和个人不得占用道路从事非交通活动。", "32": "因工程建设需要占用、挖掘道路，或者跨越、穿越道路架设、增设管线设施，应当事先征得道路主管部门的同意；影响交通安全的，还应当征得公安机关交通管理部门的同意。\n施工作业单位应当在经批准的路段和时间内施工作业，并在距离施工作业地点来车方向安全距离处设置明显的安全警示标志，采取防护措施；施工作业完毕，应当迅速清除道路上的障碍物，消除安全隐患，经道路主管部门和公安机关交通管理部门验收合格，符合通行要求后，方可恢复通行。", "34": "学校、幼儿园、医院、养老院门前的道路没有行人过街设施的，应当施划人行横道线，设置提示标志。", "35": "机动车、非机动车实行右侧通行。", "36": "根据道路条件和通行需要，道路划分为机动车道、非机动车道和人行道的，机动车、非机动车、行人实行分道通行。没有划分机动车道、非机动车道和人行道的，机动车在道路中间通行，非机动车和行人在道路两侧通行。", "37": "道路划设专用车道的，在专用车道内，只准许规定的车辆通行，其他车辆不得进入专用车道内行驶。", "38": "车辆、行人应当按照交通信号通行；遇有交通警察现场指挥时，应当按照交通警察的指挥通行；在没有交通信号的道路上，应当在确保安全、畅通的原则下通行。", "39": "公安机关交通管理部门根据道路和交通流量的具体情况，可以对机动车、非机动车、行人采取疏导、限制通行、禁止通行等措施。遇有大型群众性活动、大范围施工等情况，需要采取限制交通的措施，或者作出与公众的道路交通活动直接有关的决定，应当提前向社会公告。", "40": "遇有自然灾害、恶劣气象条件或者重大交通事故等严重影响交通安全的情形，采取其他措施难以保证交通安全时，公安机关交通管理部门可以实行交通管制。", "42": "机动车上道路行驶，不得超过限速标志标明的最高时速。在没有限速标志的路段，应当保持安全车速。\n夜间行驶或者在容易发生危险的路段行驶，以及遇有沙尘、冰雹、雨、雪、雾、结冰等气象条件时，应当降低行驶速度。", "43": "同车道行驶的机动车，后车应当与前车保持足以采取紧急制动措施的安全距离。有下列情形之一的，不得超车：\n（一）前车正在左转弯、掉头、超车的；\n（二）与对面来车有会车可能的；\n（三）前车为执行紧急任务的警车、消防车、救护车、工程救险车的；\n（四）行经铁路道口、交叉路口、窄桥、弯道、陡坡、隧道、人行横道、市区交通流量大的路段等没有超车条件的。", "44": "机动车通过交叉路口，应当按照交通信号灯、交通标志、交通标线或者交通警察的指挥通过；通过没有交通信号灯、交通标志、交通标线或者交通警察指挥的交叉路口时，应当减速慢行，并让行人和优先通行的车辆先行。", "45": "机动车遇有前方车辆停车排队等候或者缓慢行驶时，不得借道超车或者占用对面车道，不得穿插等候的车辆。\n在车道减少的路段、路口，或者在没有交通信号灯、交通标志、交通标线或者交通警察指挥的交叉路口遇到停车排队等候或者缓慢行驶时，机动车应当依次交替通行。", "46": "机动车通过铁路道口时，应当按照交通信号或者管理人员的指挥通行；没有交通信号或者管理人员的，应当减速或者停车，在确认安全后通过。", "47": "机动车行经人行横道时，应当减速行驶；遇行人正在通过人行横道，应当停车让行。\n机动车行经没有交通信号的道路时，遇行人横过道路，应当避让。", "48": "机动车载物应当符合核定的载质量，严禁超载；载物的长、宽、高不得违反装载要求，不得遗洒、飘散载运物。\n机动车运载超限的不可解体的物品，影响交通安全的，应当按照公安机关交通管理部门指定的时间、路线、速度行驶，悬挂明显标志。\n机动车载运爆炸物品、易燃易爆化学物品以及剧毒、放射性等危险物品，应当经公安机关批准后，按指定的时间、路线、速度行驶，悬挂警示标志并采取必要的安全措施。", "49": "机动车载人不得超过核定的人数，客运机动车不得违反规定载货。", "50": "禁止货运机动车载客。\n货运机动车需要附载作业人员的，应当设置保护作业人员的安全措施。", "51": "机动车行驶时，驾驶人、乘坐人员应当按规定使用安全带，摩托车驾驶人及乘坐人员应当按规定戴安全头盔。", "52": "机动车在道路上发生故障，需要停车排除故障时，驾驶人应当立即开启危险报警闪光灯，将机动车移至不妨碍交通的地方停放；难以移动的，应当持续开启危险报警闪光灯，并在来车方向设置警告标志等措施扩大示警距离，必要时迅速报警。", "53": "警车、消防车、救护车、工程救险车执行紧急任务时，可以使用警报器、标志灯具；在确保安全的前提下，不受行驶路线、行驶方向、行驶速度和信号灯的限制，其他车辆和行人应当让行。\n警车、消防车、救护车、工程救险车非执行紧急任务时，不得使用警报器、标志灯具，不享有前款规定的道路优先通行权。", "54": "道路养护车辆、工程作业车进行作业时，在不影响过往车辆通行的前提下，其行驶路线和方向不受交通标志、标线限制，过往车辆和人员应当注意避让。\n洒水车、清扫车等机动车应当按照安全作业标准作业；在不影响其他车辆通行的情况下，可以不受车辆分道行驶的限制，但是不得逆向行驶。", "55": "高速公路、大中城市中心城区内的道路，禁止拖拉机通行。其他禁止拖拉机通行的道路，由省、自治区、直辖市人民政府根据当地实际情况规定。\n在允许拖拉机通行的道路上，拖拉机可以从事货运，但是不得用于载人。", "56": "机动车应当在规定地点停放。禁止在人行道上停放机动车；但是，依照本法第三十三条规定施划的停车泊位除外。\n在道路上临时停车的，不得妨碍其他车辆和行人通行。", "57": "驾驶非机动车在道路上行驶应当遵守有关交通安全的规定。非机动车应当在非机动车道内行驶；在没有非机动车道的道路上，应当靠车行道的右侧行驶。", "58": "残疾人机动轮椅车、电动自行车在非机动车道内行驶时，最高时速不得超过十五公里。", "59": "非机动车应当在规定地点停放。未设停放地点的，非机动车停放不得妨碍其他车辆和行人通行。", "60": "驾驭畜力车，应当使用驯服的牲畜；驾驭畜力车横过道路时，驾驭人应当下车牵引牲畜；驾驭人离开车辆时，应当拴系牲畜。", "61": "行人应当在人行道内行走，没有人行道的靠路边行走。", "62": "行人通过路口或者横过道路，应当走人行横道或者过街设施；通过有交通信号灯的人行横道，应当按照交通信号灯指示通行；通过没有交通信号灯、人行横道的路口，或者在没有过街设施的路段横过道路，应当在确认安全后通过。", "63": "行人不得跨越、倚坐道路隔离设施，不得扒车、强行拦车或者实施妨碍道路交通安全的其他行为。", "64": "学龄前儿童以及不能辨认或者不能控制自己行为的精神疾病患者、智力障碍者在道路上通行，应当由其监护人、监护人委托的人或者对其负有管理、保护职责的人带领。\n盲人在道路上通行，应当使用盲杖或者采取其他导盲手段，车辆应当避让盲人。", "65": "行人通过铁路道口时，应当按照交通信号或者管理人员的指挥通行；没有交通信号和管理人员的，应当在确认无火车驶临后，迅速通过。", "66": "乘车人不得携带易燃易爆等危险物品，不得向车外抛洒物品，不得有影响驾驶人安全驾驶的行为。", "67": "行人、非机动车、拖拉机、轮式专用机械车、铰接式客车、全挂拖斗车以及其他设计最高时速低于七十公里的机动车，不得进入高速公路。高速公路限速标志标明的最高时速不得超过一百二十公里。", "68": "机动车在高速公路上发生故障时，应当依照本法第五十二条的有关规定办理；但是，警告标志应当设置在故障车来车方向一百五十米以外，车上人员应当迅速转移到右侧路肩上或者应急车道内，并且迅速报警。\n机动车在高速公路上发生故障或者交通事故，无法正常行驶的，应当由救援车、清障车拖曳、牵引。", "70": "在道路上发生交通事故，车辆驾驶人应当立即停车，保护现场；造成人身伤亡的，车辆驾驶人应当立即抢救受伤人员，并迅速报告执勤的交通警察或者公安机关交通管理部门。因抢救受伤人员变动现场的，应当标明位置。\n在道路上发生交通事故，未造成人身伤亡，当事人对事实及成因无争议的，可以即行撤离现场，恢复交通，自行协商处理损害赔偿事宜。", "72": "公安机关交通管理部门接到交通事故报警后，应当立即派交通警察赶赴现场，先组织抢救受伤人员，并采取措施，尽快恢复交通。\n交通警察应当对交通事故现场进行勘验、检查，收集证据；因收集证据的需要，可以扣留事故车辆，但是应当妥善保管，以备核查。", "75": "医疗机构对交通事故中的受伤人员应当及时抢救，不得因抢救费用未及时支付而拖延救治。肇事车辆参加机动车第三者责任强制保险的，由保险公司在责任限额范围内支付抢救费用；抢救费用超过责任限额的，未参加机动车第三者责任强制保险或者肇事后逃逸的，由道路交通事故社会救助基金先行垫付部分或者全部抢救费用。", "78": "公安机关交通管理部门应当加强对交通警察的管理，提高交通警察的素质和管理道路交通的水平。\n公安机关交通管理部门应当对交通警察进行法制和交通安全管理业务培训、考核。交通警察经考核不合格的，不得上岗执行职务。", "82": "公安机关交通管理部门依法实施罚款的行政处罚，应当依照有关法律、行政法规的规定，实施罚款决定与罚款收缴分离；收缴的罚款以及依法没收的违法所得，应当全部上缴国库。", "89": "行人、乘车人、非机动车驾驶人违反道路交通安全法律、法规关于道路通行规定的，处警告或者五元以上五十元以下罚款；非机动车驾驶人拒绝接受罚款处罚的，可以扣留其非机动车。", "90": "机动车驾驶人违反道路交通安全法律、法规关于道路通行规定的，处警告或者二十元以上二百元以下罚款。本法另有规定的，依照规定处罚。", "91": "饮酒后驾驶机动车的，处暂扣六个月机动车驾驶证，并处一千元以上二千元以下罚款。因饮酒后驾驶机动车被处罚，再次饮酒后驾驶机动车的，处十日以下拘留，并处一千元以上二千元以下罚款，吊销机动车驾驶证。\n醉酒驾驶机动车的，由公安机关交通管理部门约束至酒醒，吊销机动车驾驶证，依法追究刑事责任；五年内不得重新取得机动车驾驶证。\n饮酒后驾驶营运机动车的，处十五日拘留，并处五千元罚款，吊销机动车驾驶证，五年内不得重新取得机动车驾驶证。\n醉酒驾驶营运机动车的，由公安机关交通管理部门约束至酒醒，吊销机动车驾驶证，依法追究刑事责任；十年内不得重新取得机动车驾驶证，重新取得机动车驾驶证后，不得驾驶营运机动车。", "92": "公路客运车辆载客超过额定乘员的，处二百元以上五百元以下罚款；超过额定乘员百分之二十或者违反规定载货的，处五百元以上二千元以下罚款。\n货运机动车超过核定载质量的，处二百元以上五百元以下罚款；超过核定载质量百分之三十或者违反规定载客的，处五百元以上二千元以下罚款。\n有前两款行为的，由公安机关交通管理部门扣留机动车至违法状态消除。", "93": "对违反道路交通安全法律、法规关于机动车停放、临时停车规定的，可以指出违法行为，并予以口头警告，令其立即驶离。\n机动车驾驶人不在现场或者虽在现场但拒绝立即驶离，妨碍其他车辆、行人通行的，处二十元以上二百元以下罚款，并可以将该机动车拖移至不妨碍交通的地点或者公安机关交通管理部门指定的地点停放。", "94": "机动车安全技术检验机构实施机动车安全技术检验超过国务院价格主管部门核定的收费标准收取费用的，退还多收取的费用，并由价格主管部门依照《中华人民共和国价格法》的有关规定给予处罚。\n机动车安全技术检验机构不按照机动车国家安全技术标准进行检验，出具虚假检验结果的，由公安机关交通管理部门处所收检验费用五倍以上十倍以下罚款，并依法撤销其检验资格；构成犯罪的，依法追究刑事责任。", "95": "上道路行驶的机动车未悬挂机动车号牌，未放置检验合格标志、保险标志，或者未随车携带行驶证、驾驶证的，公安机关交通管理部门应当扣留机动车，通知当事人提供相应的牌证、标志或者补办相应手续，并可以依照本法第九十条的规定予以处罚。\n故意遮挡、污损或者不按规定安装机动车号牌的，依照本法第九十条的规定予以处罚。", "96": "伪造、变造或者使用伪造、变造的机动车登记证书、号牌、行驶证、驾驶证的，由公安机关交通管理部门予以收缴，扣留该机动车，处十五日以下拘留，并处二千元以上五千元以下罚款；构成犯罪的，依法追究刑事责任。\n伪造、变造或者使用伪造、变造的检验合格标志、保险标志的，由公安机关交通管理部门予以收缴，扣留该机动车，处十日以下拘留，并处一千元以上三千元以下罚款；构成犯罪的，依法追究刑事责任。\n使用其他车辆的机动车登记证书、号牌、行驶证、检验合格标志、保险标志的，由公安机关交通管理部门予以收缴，扣留该机动车，处二千元以上五千元以下罚款。", "97": "非法安装警报器、标志灯具的，由公安机关交通管理部门强制拆除，予以收缴，并处二百元以上二千元以下罚款。", "98": "机动车所有人、管理人未按照国家规定投保机动车第三者责任强制保险的，由公安机关交通管理部门扣留车辆至依照规定投保后，并处依照规定投保最低责任限额应缴纳的保险费的二倍罚款。", "99": "有下列行为之一的，由公安机关交通管理部门处二百元以上二千元以下罚款：\n（一）未取得机动车驾驶证、机动车驾驶证被吊销或者机动车驾驶证被暂扣期间驾驶机动车的；\n（二）将机动车交由未取得机动车驾驶证或者机动车驾驶证被吊销、暂扣的人驾驶的；\n（三）造成交通事故后逃逸，尚不构成犯罪的；\n（四）机动车行驶超过规定时速百分之五十的；\n（五）强迫机动车驾驶人违反道路交通安全法律、法规和机动车安全驾驶要求驾驶机动车，造成交通事故，尚不构成犯罪的；\n（六）违反交通管制的规定强行通行，不听劝阻的；\n（七）故意损毁、移动、涂改交通设施，造成危害后果，尚不构成犯罪的；\n（八）非法拦截、扣留机动车辆，不听劝阻，造成交通严重阻塞或者较大财产损失的。\n行为人有前款第二项、第四项情形之一的，可以并处吊销机动车驾驶证；有第一项、第三项、第五项至第八项情形之一的，可以并处十五日以下拘留。", "100": "驾驶拼装的机动车或者已达到报废标准的机动车上道路行驶的，公安机关交通管理部门应当予以收缴，强制报废。\n对驾驶前款所列机动车上道路行驶的驾驶人，处二百元以上二千元以下罚款，并吊销机动车驾驶证。\n出售已达到报废标准的机动车的，没收违法所得，处销售金额等额的罚款，对该机动车依照本条第一款的规定处理。", "101": "违反道路交通安全法律、法规的规定，发生重大交通事故，构成犯罪的，依法追究刑事责任，并由公安机关交通管理部门吊销机动车驾驶证。\n造成交通事故后逃逸的，由公安机关交通管理部门吊销机动车驾驶证，且终生不得重新取得机动车驾驶证。", "103": "国家机动车产品主管部门未按照机动车国家安全技术标准严格审查，许可不合格机动车型投入生产的，对负有责任的主管人员和其他直接责任人员给予降级或者撤职的行政处分。\n擅自生产、销售未经国家机动车产品主管部门许可生产的机动车型的，没收非法生产、销售的机动车成品及配件，可以并处非法产品价值三倍以上五倍以下罚款。", "104": "未经批准，擅自挖掘道路、占用道路施工或者从事其他影响道路交通安全活动的，由道路主管部门责令停止违法行为，并恢复原状，可以依法给予罚款；致使通行的人员、车辆及其他财产遭受损失的，依法承担赔偿责任。\n有前款行为，影响道路交通安全活动的，公安机关交通管理部门可以责令停止违法行为，迅速恢复交通。", "105": "道路施工作业或者道路出现损毁，未及时设置警示标志、未采取防护措施，或者应当设置交通信号灯、交通标志、交通标线而没有设置或者应当及时变更而没有及时变更，致使通行的人员、车辆及其他财产遭受损失的，负有相关职责的单位应当依法承担赔偿责任。", "106": "在道路两侧及隔离带上种植树木、其他植物或者设置广告牌、管线等，遮挡路灯、交通信号灯、交通标志，妨碍安全视距的，由公安机关交通管理部门责令行为人排除妨碍；拒不执行的，处二百元以上二千元以下罚款，并强制排除妨碍，所需费用由行为人负担。", "107": "对道路交通违法行为人予以警告、二百元以下罚款，交通警察可以当场作出行政处罚决定，并出具行政处罚决定书。\n行政处罚决定书应当载明当事人的违法事实、行政处罚的依据、处罚内容、时间、地点以及处罚机关名称，并由执法人员签名或者盖章。", "110": "执行职务的交通警察认为应当对道路交通违法行为人给予暂扣或者吊销机动车驾驶证处罚的，可以先予扣留机动车驾驶证，并在二十四小时内将案件移交公安机关交通管理部门处理。\n道路交通违法行为人应当在十五日内到公安机关交通管理部门接受处理。无正当理由逾期未接受处理的，吊销机动车驾驶证。", "112": "公安机关交通管理部门扣留机动车、非机动车，应当当场出具凭证，并告知当事人在规定期限内到公安机关交通管理部门接受处理。\n公安机关交通管理部门对被扣留的车辆应当妥善保管，不得使用。\n逾期不来接受处理，并且经公告三个月仍不来接受处理的，对扣留的车辆依法处理。"}, "道路交通安全法实施条例": {"6": "已注册登记的机动车有下列情形之一的，机动车所有人应当向登记该机动车的公安机关交通管理部门申请变更登记：\n（一）改变机动车车身颜色的；\n（二）更换发动机的；\n（三）更换车身或者车架的；\n（四）因质量有问题，制造厂更换整车的；\n（五）营运机动车改为非营运机动车或者非营运机动车改为营运机动车的；\n（六）机动车所有人的住所迁出或者迁入公安机关交通管理部门管辖区域的。", "7": "已注册登记的机动车所有权发生转移的，应当及时办理转移登记。", "13": "机动车号牌应当悬挂在车前、车后指定位置，保持清晰、完整。重型、中型载货汽车及其挂车、拖拉机及其挂车的车身或者车厢后部应当喷涂放大的牌号，字样应当端正并保持清晰。\n机动车检验合格标志、保险标志应当粘贴在机动车前窗右上角。", "16": "机动车应当从注册登记之日起，按照下列期限进行安全技术检验：\n（一）营运载客汽车5年以内每年检验1次；超过5年的，每6个月检验1次；\n（二）载货汽车和大型、中型非营运载客汽车10年以内每年检验1次；超过10年的，每6个月检验1次；\n（三）小型、微型非营运载客汽车6年以内每2年检验1次；超过6年的，每年检验1次；超过15年的，每6个月检验1次；\n（四）摩托车4年以内每2年检验1次；超过4年的，每年检验1次；\n（五）拖拉机和其他机动车每年检验1次。", "17": "已注册登记的机动车进行安全技术检验时，机动车行驶证记载的登记内容与该机动车的有关情况不符，或者未按照规定提供机动车第三者责任强制保险凭证的，不予通过检验。", "18": "警车、消防车、救护车、工程救险车标志图案的喷涂以及警报器、标志灯具的安装、使用规定，由国务院公安部门制定。", "20": "学习机动车驾驶，应当先学习道路交通安全法律、法规和相关知识，考试合格后，再学习机动车驾驶技能。\n在道路上学习驾驶，应当按照公安机关交通管理部门指定的路线、时间进行。在道路上学习机动车驾驶技能应当使用教练车，在教练员随车指导下进行，与教学无关的人员不得乘坐教练车。学员在学习驾驶中有道路交通安全违法行为或者造成交通事故的，由教练员承担责任。", "22": "机动车驾驶证的有效期为6年。\n机动车驾驶人初次申领机动车驾驶证后的12个月为实习期。在实习期内驾驶机动车的，应当在车身后部粘贴或者悬挂统一式样的实习标志。\n机动车驾驶人在实习期内不得驾驶公共汽车、营运客车或者执行任务的警车、消防车、救护车、工程救险车以及载有爆炸物品、易燃易爆化学物品、剧毒或者放射性等危险物品的机动车；驾驶的机动车不得牵引挂车。", "23": "公安机关交通管理部门对机动车驾驶人的道路交通安全违法行为除给予行政处罚外，实行道路交通安全违法行为累积记分制度，记分周期为12个月。对在一个记分周期内记分达到12分的，由公安机关交通管理部门扣留其机动车驾驶证，该机动车驾驶人应当按照规定参加道路交通安全法律、法规的学习并接受考试。考试合格的，记分予以清除，发还机动车驾驶证；考试不合格的，继续参加学习和考试。", "25": "机动车驾驶人记分达到12分，拒不参加公安机关交通管理部门通知的学习，也不接受考试的，由公安机关交通管理部门公告其机动车驾驶证停止使用。", "28": "机动车驾驶人在机动车驾驶证丢失、损毁、超过有效期或者被依法扣留、暂扣期间以及记分达到12分的，不得驾驶机动车。", "35": "道路养护施工单位在道路上进行养护、维修时，应当按照规定设置规范的安全警示标志和安全防护设施。道路养护施工作业车辆、机械应当安装示警灯，喷涂明显的标志图案，作业时应当开启示警灯和危险报警闪光灯。", "38": "机动车信号灯和非机动车信号灯表示：\n（一）绿灯亮时，准许车辆通行，但转弯的车辆不得妨碍被放行的直行车辆、行人通行；\n（二）黄灯亮时，已越过停止线的车辆可以继续通行；\n（三）红灯亮时，禁止车辆通行。\n在未设置非机动车信号灯和人行横道信号灯的路口，非机动车和行人应当按照机动车信号灯的表示通行。\n红灯亮时，右转弯的车辆在不妨碍被放行的车辆、行人通行的情况下，可以通行。", "42": "闪光警告信号灯为持续闪烁的黄灯，提示车辆、行人通行时注意瞭望，确认安全后通过。", "43": "道路与铁路平面交叉道口有两个红灯交替闪烁或者一个红灯亮时，表示禁止车辆、行人通行；红灯熄灭时，表示允许车辆、行人通行。", "44": "在道路同方向划有2条以上机动车道的，左侧为快速车道，右侧为慢速车道。在快速车道行驶的机动车应当按照快速车道规定的速度行驶，未达到快速车道规定的行驶速度的，应当在慢速车道行驶。摩托车应当在最右侧车道行驶。\n在道路同方向划有2条以上机动车道的，变更车道的机动车不得影响相关车道内行驶的机动车的正常行驶。", "45": "机动车在道路上行驶不得超过限速标志、标线标明的速度。在没有限速标志、标线的道路上，机动车不得超过下列最高行驶速度：\n（一）没有道路中心线的道路，城市道路为每小时30公里，公路为每小时40公里；\n（二）同方向只有1条机动车道的道路，城市道路为每小时50公里，公路为每小时70公里。", "46": "机动车行驶中遇有下列情形之一的，最高行驶速度不得超过每小时30公里，其中拖拉机、电瓶车、轮式专用机械车不得超过每小时15公里：\n（一）进出非机动车道，通过铁路道口、急弯路、窄路、窄桥时；\n（二）掉头、转弯、下陡坡时；\n（三）遇雾、雨、雪、沙尘、冰雹，能见度在50米以内时；\n（四）在冰雪、泥泞的道路上行驶时；\n（五）牵引发生故障的机动车时。", "47": "机动车超车时，应当提前开启左转向灯、变换使用远、近光灯或者鸣喇叭。在没有道路中心线或者同方向只有1条机动车道的道路上，前车遇后车发出超车信号时，在条件许可的情况下，应当降低速度、靠右让路。后车应当在确认有充足的安全距离后，从前车的左侧超越，在与被超车辆拉开必要的安全距离后，开启右转向灯，驶回原车道。", "48": "在没有中心隔离设施或者没有中心线的道路上，机动车遇相对方向来车时应当遵守下列规定：\n（一）减速靠右行驶，并与其他车辆、行人保持必要的安全距离；\n（二）在有障碍的路段，无障碍的一方先行；但有障碍的一方已驶入障碍路段而无障碍的一方未驶入时，有障碍的一方先行；\n（三）在狭窄的坡路，上坡的一方先行；但下坡的一方已行至中途而上坡的一方未上坡时，下坡的一方先行；\n（四）在狭窄的山路，不靠山体的一方先行；\n（五）夜间会车应当在距相对方向来车150米以外改用近光灯，在窄路、窄桥与非机动车会车时应当使用近光灯。", "49": "机动车在有禁止掉头或者禁止左转弯标志、标线的地点以及在铁路道口、人行横道、桥梁、急弯、陡坡、隧道或者容易发生危险的路段，不得掉头。\n机动车在没有禁止掉头或者没有禁止左转弯标志、标线的地点可以掉头，但不得妨碍正常行驶的其他车辆和行人的通行。", "50": "机动车倒车时，应当察明车后情况，确认安全后倒车。不得在铁路道口、交叉路口、单行路、桥梁、急弯、陡坡或者隧道中倒车。", "51": "机动车通过有交通信号灯控制的交叉路口，应当按照下列规定通行：\n（一）在划有导向车道的路口，按所需行进方向驶入导向车道；\n（二）准备进入环形路口的让已在路口内的机动车先行；\n（三）向左转弯时，靠路口中心点左侧转弯。转弯时开启转向灯，夜间行驶开启近光灯；\n（四）遇放行信号时，依次通过；\n（五）遇停止信号时，依次停在停止线以外。没有停止线的，停在路口以外；\n（六）向右转弯遇有同车道前车正在等候放行信号时，依次停车等候；\n（七）在没有方向指示信号灯的交叉路口，转弯的机动车让直行的车辆、行人先行。相对方向行驶的右转弯机动车让左转弯车辆先行。", "52": "机动车通过没有交通信号灯控制也没有交通警察指挥的交叉路口，除应当遵守第五十一条第（二）项、第（三）项的规定外，还应当遵守下列规定：\n（一）有交通标志、标线控制的，让优先通行的一方先行；\n（二）没有交通标志、标线控制的，在进入路口前停车瞭望，让右方道路的来车先行；\n（三）转弯的机动车让直行的车辆先行；\n（四）相对方向行驶的右转弯的机动车让左转弯的车辆先行。", "53": "机动车遇有前方交叉路口交通阻塞时，应当依次停在路口以外等候，不得进入路口。\n机动车在遇有前方机动车停车排队等候或者缓慢行驶时，应当依次排队，不得从前方车辆两侧穿插或者超越行驶，不得在人行横道、网状线区域内停车等候。\n机动车在车道减少的路口、路段，遇有前方机动车停车排队等候或者缓慢行驶的，应当每车道一辆依次交替驶入车道减少后的路口、路段。", "54": "机动车载物不得超过机动车行驶证上核定的载质量，装载长度、宽度不得超出车厢，并应当遵守下列规定：\n（一）重型、中型载货汽车，半挂车载物，高度从地面起不得超过4米，载运集装箱的车辆不得超过4.2米；\n（二）其他载货的机动车载物，高度从地面起不得超过2.5米；\n（三）摩托车载物，高度从地面起不得超过1.5米，长度不得超出车身0.2米。两轮摩托车载物宽度左右各不得超出车把0.15米；三轮摩托车载物宽度不得超过车身。\n载客汽车除车身外部的行李架和内置的行李箱外，不得载货。载客汽车行李架载货，从车顶起高度不得超过0.5米，从地面起高度不得超过4米。", "55": "机动车载人应当遵守下列规定：\n（一）公路载客汽车不得超过核定的载客人数，但按照规定免票的儿童除外，在载客人数已满的情况下，按照规定免票的儿童不得超过核定载客人数的10%；\n（二）载货汽车车厢不得载客。在城市道路上，货运机动车在留有安全位置的情况下，车厢内可以附载临时作业人员1人至5人；载物高度超过车厢栏板时，货物上不得载人；\n（三）摩托车后座不得乘坐未满12周岁的未成年人，轻便摩托车不得载人。", "56": "机动车牵引挂车应当符合下列规定：\n（一）载货汽车、半挂牵引车、拖拉机只允许牵引1辆挂车。挂车的灯光信号、制动、连接、安全防护等装置应当符合国家标准；\n（二）小型载客汽车只允许牵引旅居挂车或者总质量700千克以下的挂车。挂车不得载人；\n（三）载货汽车所牵引挂车的载质量不得超过载货汽车本身的载质量。\n大型、中型载客汽车，低速载货汽车，三轮汽车以及其他机动车不得牵引挂车。", "57": "机动车应当按照下列规定使用转向灯：\n（一）向左转弯、向左变更车道、准备超车、驶离停车地点或者掉头时，应当提前开启左转向灯；\n（二）向右转弯、向右变更车道、超车完毕驶回原车道、靠路边停车时，应当提前开启右转向灯。", "58": "机动车在夜间没有路灯、照明不良或者遇有雾、雨、雪、沙尘、冰雹等低能见度情况下行驶时，应当开启前照灯、示廓灯和后位灯，但同方向行驶的后车与前车近距离行驶时，不得使用远光灯。机动车雾天行驶应当开启雾灯和危险报警闪光灯。", "59": "机动车在夜间通过急弯、坡路、拱桥、人行横道或者没有交通信号灯控制的路口时，应当交替使用远近光灯示意。\n机动车驶近急弯、坡道顶端等影响安全视距的路段以及超车或者遇有紧急情况时，应当减速慢行，并鸣喇叭示意。", "60": "机动车在道路上发生故障或者发生交通事故，妨碍交通又难以移动的，应当按照规定开启危险报警闪光灯并在车后50米至100米处设置警告标志，夜间还应当同时开启示廓灯和后位灯。", "61": "牵引故障机动车应当遵守下列规定：\n（一）被牵引的机动车除驾驶人外不得载人，不得拖带挂车；\n（二）被牵引的机动车宽度不得大于牵引机动车的宽度；\n（三）使用软连接牵引装置时，牵引车与被牵引车之间的距离应当大于4米小于10米；\n（四）对制动失效的被牵引车，应当使用硬连接牵引装置牵引；\n（五）牵引车和被牵引车均应当开启危险报警闪光灯。\n汽车吊车和轮式专用机械车不得牵引车辆。摩托车不得牵引车辆或者被其他车辆牵引。", "62": "驾驶机动车不得有下列行为：\n（一）在车门、车厢没有关好时行车；\n（二）在机动车驾驶室的前后窗范围内悬挂、放置妨碍驾驶人视线的物品；\n（三）拨打接听手持电话、观看电视等妨碍安全驾驶的行为；\n（四）下陡坡时熄火或者空挡滑行；\n（五）向道路上抛撒物品；\n（六）驾驶摩托车手离车把或者在车把上悬挂物品；\n（七）连续驾驶机动车超过4小时未停车休息或者停车休息时间少于20分钟；\n（八）在禁止鸣喇叭的区域或者路段鸣喇叭。", "63": "机动车在道路上临时停车，应当遵守下列规定：\n（一）在设有禁停标志、标线的路段，在机动车道与非机动车道、人行道之间设有隔离设施的路段以及人行横道、施工地段，不得停车；\n（二）交叉路口、铁路道口、急弯路、宽度不足4米的窄路、桥梁、陡坡、隧道以及距离上述地点50米以内的路段，不得停车；\n（三）公共汽车站、急救站、加油站、消防栓或者消防队（站）门前以及距离上述地点30米以内的路段，除使用上述设施的以外，不得停车；\n（四）车辆停稳前不得开车门和上下人员，开关车门不得妨碍其他车辆和行人通行；\n（五）路边停车应当紧靠道路右侧，机动车驾驶人不得离车，上下人员或者装卸物品后，立即驶离。", "64": "机动车行经漫水路或者漫水桥时，应当停车察明水情，确认安全后，低速通过。", "65": "机动车载运超限物品行经铁路道口的，应当按照当地铁路部门指定的铁路道口、时间通过。\n机动车行经渡口，应当服从渡口管理人员指挥，按照指定地点依次待渡。机动车上下渡船时，应当低速慢行。", "66": "警车、消防车、救护车、工程救险车在执行紧急任务遇交通受阻时，可以断续使用警报器，并遵守下列规定：\n（一）不得在禁止使用警报器的区域或者路段使用警报器；\n（二）夜间在市区不得使用警报器；\n（三）列队行驶时，前车已经使用警报器的，后车不再使用警报器。", "67": "在单位院内、居民居住区内，机动车应当低速行驶，避让行人；有限速标志的，按照限速标志行驶。", "68": "非机动车通过有交通信号灯控制的交叉路口，应当按照下列规定通行：\n（一）转弯的非机动车让直行的车辆、行人优先通行；\n（二）遇有前方路口交通阻塞时，不得进入路口；\n（三）向左转弯时，靠路口中心点的右侧转弯；\n（四）遇有停止信号时，应当依次停在路口停止线以外。没有停止线的，停在路口以外；\n（五）向右转弯遇有同方向前车正在等候放行信号时，在本车道内能够转弯的，可以通行；不能转弯的，依次等候。", "69": "非机动车通过没有交通信号灯控制也没有交通警察指挥的交叉路口，除应当遵守第六十八条第（一）项、第（二）项和第（三）项的规定外，还应当遵守下列规定：\n（一）有交通标志、标线控制的，让优先通行的一方先行；\n（二）没有交通标志、标线控制的，在路口外慢行或者停车瞭望，让右方道路的来车先行；\n（三）相对方向行驶的右转弯的非机动车让左转弯的车辆先行。", "70": "驾驶自行车、电动自行车、三轮车在路段上横过机动车道，应当下车推行，有人行横道或者行人过街设施的，应当从人行横道或者行人过街设施通过；没有人行横道、没有行人过街设施或者不便使用行人过街设施的，在确认安全后直行通过。", "71": "非机动车载物，应当遵守下列规定：\n（一）自行车、电动自行车、残疾人机动轮椅车载物，高度从地面起不得超过1.5米，宽度左右各不得超出车把0.15米，长度前端不得超出车轮，后端不得超出车身0.3米；\n（二）三轮车、人力车载物，高度从地面起不得超过2米，宽度左右各不得超出车身0.2米，长度不得超出车身1米；\n（三）畜力车载物，高度从地面起不得超过2.5米，宽度左右各不得超出车身0.2米，长度前端不得超出车辕，后端不得超出车身1米。", "72": "在道路上驾驶自行车、三轮车、电动自行车、残疾人机动轮椅车应当遵守下列规定：\n（一）驾驶自行车、三轮车必须年满12周岁；\n（二）驾驶电动自行车和残疾人机动轮椅车必须年满16周岁；\n（三）不得醉酒驾驶；\n（四）转弯前应当减速慢行，伸手示意，不得突然猛拐，超越前车时不得妨碍被超越的车辆行驶；\n（五）不得牵引、攀扶车辆或者被其他车辆牵引，不得双手离把或者手中持物；\n（六）不得扶身并行、互相追逐或者曲折竞驶；\n（七）不得在道路上骑独轮自行车或者2人以上骑行的自行车；\n（八）非下肢残疾的人不得驾驶残疾人机动轮椅车；\n（九）自行车、三轮车不得加装动力装置。", "73": "在道路上驾驭畜力车应当年满16周岁，并遵守下列规定：\n（一）不得醉酒驾驭；\n（二）不得并行，驾驭人不得离开车辆；\n（三）行经繁华路段、交叉路口、铁路道口、人行横道、急弯路、宽度不足4米的窄路或者窄桥、陡坡、隧道或者容易发生危险的路段，不得超车。驾驭两轮畜力车应当下车牵引牲畜。", "74": "行人不得有下列行为：\n（一）在道路上使用滑板、旱冰鞋等滑行工具；\n（二）在车行道内坐卧、停留、嬉闹；\n（三）追车、抛物击车等妨碍道路交通安全的行为。", "75": "行人横过机动车道，应当从行人过街设施通过；没有行人过街设施的，应当从人行横道通过；没有人行横道的，应当观察来往车辆的情况，确认安全后直行通过，不得在车辆临近时突然加速横穿或者中途倒退、折返。", "76": "行人列队在道路上通行，每横列不得超过2人，但在已经实行交通管制的路段不受限制。", "77": "乘坐机动车应当遵守下列规定：\n（一）不得在机动车道上拦乘机动车；\n（二）在机动车道上不得从机动车左侧上下车；\n（三）开关车门不得妨碍其他车辆和行人通行；\n（四）机动车行驶中，不得干扰驾驶，不得将身体任何部分伸出车外，不得跳车；\n（五）乘坐两轮摩托车应当正向骑坐。", "78": "高速公路应当标明车道的行驶速度，最高车速不得超过每小时120公里，最低车速不得低于每小时60公里。\n在高速公路上行驶的小型载客汽车最高车速不得超过每小时120公里，其他机动车不得超过每小时100公里，摩托车不得超过每小时80公里。\n同方向有2条车道的，左侧车道的最低车速为每小时100公里；同方向有3条以上车道的，最左侧车道的最低车速为每小时110公里，中间车道的最低车速为每小时90公里。", "79": "机动车从匝道驶入高速公路，应当开启左转向灯，在不妨碍已在高速公路内的机动车正常行驶的情况下驶入车道。\n机动车驶离高速公路时，应当开启右转向灯，驶入减速车道，降低车速后驶离。", "81": "机动车在高速公路上行驶，遇有雾、雨、雪、沙尘、冰雹等低能见度气象条件时，应当遵守下列规定：\n（一）能见度小于200米时，开启雾灯、近光灯、示廓灯和前后位灯，车速不得超过每小时60公里，与同车道前车保持100米以上的距离；\n（二）能见度小于100米时，开启雾灯、近光灯、示廓灯、前后位灯和危险报警闪光灯，车速不得超过每小时40公里，与同车道前车保持50米以上的距离；\n（三）能见度小于50米时，开启雾灯、近光灯、示廓灯、前后位灯和危险报警闪光灯，车速不得超过每小时20公里，并从最近的出口尽快驶离高速公路。", "82": "机动车在高速公路上行驶，不得有下列行为：\n（一）倒车、逆行、穿越中央分隔带掉头或者在车道内停车；\n（二）在匝道、加速车道或者减速车道上超车；\n（三）骑、轧车行道分界线或者在路肩上行驶；\n（四）非紧急情况时在应急车道行驶或者停车；\n（五）试车或者学习驾驶机动车。", "83": "在高速公路上行驶的载货汽车车厢不得载人。两轮摩托车在高速公路行驶时不得载人。", "84": "机动车通过施工作业路段时，应当注意警示标志，减速行驶。", "85": "城市快速路的道路交通安全管理，参照本节的规定执行。", "93": "公安机关交通管理部门对经过勘验、检查现场的交通事故应当在勘查现场之日起10日内制作交通事故认定书。对需要进行检验、鉴定的，应当在检验、鉴定结果确定之日起5日内制作交通事故认定书。", "103": "以欺骗、贿赂等不正当手段取得机动车登记或者驾驶许可的，收缴机动车登记证书、号牌、行驶证或者机动车驾驶证，撤销机动车登记或者机动车驾驶许可；申请人在3年内不得申请机动车登记或者机动车驾驶许可。", "105": "机动车驾驶人有饮酒、醉酒、服用国家管制的精神药品或者麻醉药品嫌疑的，应当接受测试、检验。", "107": "依照道路交通安全法第九十二条、第九十五条、第九十六条、第九十八条的规定被扣留的机动车，驾驶人或者所有人、管理人30日内没有提供被扣留机动车的合法证明，没有补办相应手续，或者不前来接受处理，经公安机关交通管理部门通知并且经公告3个月仍不前来接受处理的，由公安机关交通管理部门将该机动车送交有资格的拍卖机构拍卖，所得价款上缴国库；非法拼装的机动车予以拆除；达到报废标准的机动车予以报废。"}, "浙江省实施道路交通安全法办法": {"8": "上道路行驶的机动车应当悬挂公安机关交通管理部门核发的机动车号牌，不得悬挂其他号牌或者标志牌，但法律、法规允许的除外。", "10": "机动车销售前确需临时上道路行驶的，机动车所有人可以向当地公安机关交通管理部门申领临时移动证。持临时移动证上道路行驶的机动车，不得载货或者载客。\n核发临时移动证时应当载明机动车所有人、机动车厂牌型号、车辆识别代号（车架号码）、发动机号码、行驶路线、发证机关、发证日期和有效期等内容，临时移动证有效期最长不超过三日。", "11": "本省注册登记的营运载客汽车、载货汽车和半挂牵引车的车门上应当按规定喷涂单位名称、核定载客人数、核定载质量等内容，载货汽车及其挂车、大型载客汽车车厢后部应当按规定喷涂放大的本车牌号。", "13": "旅游客车、公路营运载客汽车、大型非营运载客汽车、危险化学品运输车、重型载货汽车、半挂牵引车，应当安装、使用符合国家标准的行驶记录仪。机动车所有人或者管理人应当保持行驶记录仪的正常运行。", "14": "教练车应当符合国家安全技术标准，悬挂公安机关交通管理部门核发的教练车号牌，安装教练员可以控制车辆行驶的安全装置，车门两侧喷涂单位名称。", "16": "禁止在机动车上安装和使用接收交通技术监控设备信号或者影响交通技术监控设备正常使用的装置。\n禁止在机动车号牌上安装、喷涂、粘贴影响交通技术监控信息接收的材料。", "18": "机动车维修单位应当具备法律、行政法规规定的资质条件。\n机动车维修单位应当建立维修车辆登记制度，登记内容包括送修人的身份证明、车辆牌号、车辆识别代号（车架号码）、发动机号码以及承修项目。\n机动车维修单位发现送修车辆有被盗抢、拼装、交通事故逃逸嫌疑的，应当立即报告公安机关，并配合调查。", "19": "报废机动车回收单位应当具备法律、行政法规规定的资质条件。\n报废机动车回收单位应当建立报废机动车回收登记制度，登记内容包括报废车辆所有人的身份证明、车辆牌号、车辆识别代号（车架号码）、发动机号码、回收日期及报废车辆解体过程中拍摄的照片等图像资料。", "22": "人力三轮车、电动自行车、残疾人机动轮椅车和省人民政府规定应当登记的非机动车，经公安机关交通管理部门登记后，方可上道路行驶。\n公安机关交通管理部门对自行车不实行登记制度。", "25": "公安机关交通管理部门发现机动车驾驶人取得驾驶证不符合国家规定的条件，应当予以调查或者对其道路驾驶技能进行测试。经调查或者测试证明其不符合国家规定条件的，公安机关交通管理部门应当收缴其机动车驾驶证，并转递原发证机关予以撤销。", "27": "机动车驾驶人发生人身伤亡交通事故负有同等以上责任尚不构成犯罪的，在交通事故处理完毕后，应当接受交通事故发生地公安机关交通管理部门组织的为期两日的道路交通安全法律、法规和相关知识的教育。", "35": "根据道路交通需求，在不影响行人、车辆通行的情况下，公安机关交通管理部门会同建设行政管理部门可以在城镇道路范围内施划机动车、非机动车停车泊位，限定停车时间，但不得在盲道及其配套设施所在的地方施划机动车、非机动车停车泊位。其他任何单位和个人不得设置、占用、撤除道路停车泊位。", "36": "设区的市及县（市）人民政府应当根据道路交通发展规划和安全、畅通、方便出行的要求，制定和实施公共交通发展规划，鼓励并优先发展公共交通。有条件的城市道路，应当根据公共交通发展规划，设置公交车专用道。", "38": "在有方向指示信号灯并设置左转弯待转区的交叉路口，同方向直行信号灯绿灯亮时，左转弯的车辆应当按规定依次进入待转区停车等候。", "39": "车辆应当按照下列规定分道通行：\n（一）在划分机动车道和非机动车道的道路上，机动车和非机动车分道通行；\n（二）在没有划分机动车道与非机动车道的道路上，非机动车靠近道路右边通行，机动车在道路中间或者靠近道路中心线右边通行；\n（三）在同方向划有两条以上机动车道，没有交通信号指示的，低速载货汽车、三轮汽车、拖拉机、轮式专用机械车和摩托车应当在最右侧的机动车道内通行。", "40": "借道通行的车辆或者行人，应当让本道内的车辆或者行人优先通行。\n非机动车、行人遇本道被占用无法正常通行时，可以在受阻路段借用相邻车道通行，并在通过被占用路段后迅速返回本道。车辆遇此情况应当减速让行。", "41": "机动车行驶时变更车道应当提前开启转向灯，并遵守下列规定：\n（一）不得一次性变更两条以上机动车道，但符合交通信号要求的除外；\n（二）左右两侧车道的机动车向中间车道变更时，左侧车道的机动车让右侧车道的机动车先予变更。", "42": "车辆通过没有交通信号控制的交叉路口时，应当让行人和右方道路的来车先行。\n车辆通过交叉路口同时被放行或者没有交通信号控制时，左转弯车辆应当让相对方向行驶的直行车辆先行；右转弯的机动车应当让同方向左转弯或者直行的行人和非机动车先行。", "43": "机动车在道路上行驶不得超过限速标志、标线标明的速度。在没有限速标志、标线的道路上，同方向划有两条以上机动车道的道路，城市道路最高时速为六十公里，公路最高时速为九十公里；在单位院内、居民居住区内，最高时速为二十公里。", "44": "下列机动车在道路上行驶的速度，应当遵守以下规定：\n（一）手扶拖拉机最高时速为二十公里，其他拖拉机最高时速为四十公里；\n（二）三轮汽车、轮式专用机械车、轻便摩托车最高时速为四十公里；\n（三）全挂汽车列车、低速载货汽车、摩托车和公交车最高时速为六十公里；\n（四）运载危险物品的机动车在普通公路上行驶时最高时速为六十公里，在高速公路上行驶时最高时速为八十公里。", "45": "教练用的大型载货汽车在教练时，车厢安装栏栅和固定座位后可以核载一至六名学员。\n轻型、微型载货汽车和正三轮摩托车车厢内不得载人。", "46": "因特殊情况需要在限制、禁止的区域或者路段通行、停靠的机动车，应当经公安机关交通管理部门同意，并按指定的时间、路线、地点通行或者停靠。", "47": "公交车、公路营运载客汽车应当按照指定的线路、地点行驶或者停靠。\n禁止营运中的公交车、公路营运载客汽车和旅游客车于当日二十二时至次日六时在三级以下山区公路通行。", "48": "机动车在高速公路上行驶，应当遵守下列规定：\n（一）驾驶人、乘车人在装有安全带的座位就座时，应当使用安全带；\n（二）除交通事故、车辆故障或者高速公路管理作业等必须行驶、停车的情况外，不得在路肩上行驶或者停车；\n（三）发生故障时，不得占用行驶车道检修车辆；\n（四）发生故障难以移动时或者发生交通事故后，驾驶人应当在故障车或者事故车来车方向一百五十米以外设置警告标志，车上人员应当迅速转移到右侧路肩、紧急停车带或者应急车道内，并立即报警；\n（五）遇交通阻塞停车时，车上人员不得在行驶车道内活动或者逗留，驾驶人在夜间还应当开启危险报警闪光灯、示廓灯和后位灯。", "49": "机动车所有人、管理人或者驾驶人不得有下列行为：\n（一）将机动车交由未取得机动车驾驶证、机动车驾驶证被吊销或者暂扣等不具备驾驶机动车资格的人驾驶；\n（二）赤脚、穿拖鞋或者穿高跟鞋驾驶机动车；\n（三）驾驶机动车时以手持方式使用电话；\n（四）驾驶二轮摩托车、轻便摩托车时互相追逐，攀扶其他车辆，曲折竞驶，驾驶人身前载人；\n（五）驾驶牵引车所牵引挂车的总质量超过牵引车的准牵引总质量。", "50": "非机动车驾驶人应当遵守下列规定：\n（一）保持非机动车的制动器、车铃和夜间反光装置完好；\n（二）电动自行车、残疾人机动轮椅车转弯时，应当提前开启转向灯；\n（三）不得牵引动物；\n（四）驾驶自行车、电动自行车时不得以手持方式使用电话；\n（五）驾驶自行车、电动自行车遇行人横过道路时，应当减速避让；\n（六）自行车、电动自行车限载一名十二周岁以下未成年人；\n（七）人力客运三轮车载人不得超过两人；\n（八）残疾人机动轮椅车不得载人，但二级以上残疾人驾驶残疾人机动轮椅车可以搭乘一名陪护人员。", "51": "行人应当遵守下列规定：\n（一）没有人行道的，靠近道路边行走；\n（二）从人行横道横过道路时，在确保安全的情况下，应当及时通过；\n（三）牵、赶、骑牲畜应当在允许通行的道路上靠近道路右边通行，不得影响其他车辆、行人的正常通行；\n（四）在车行道上不得拦车、带路或者从事兜售、发送物品等妨碍交通安全的活动。", "52": "在道路上发生交通事故，车辆驾驶人应当立即停车，保护现场；造成人员伤亡的，应当立即抢救受伤人员并报告医疗急救机构；因抢救受伤人员变动现场的，应当标明事故证物的位置；同时迅速报告执勤的交通警察或者公安机关交通管理部门，并主动接受调查处理，不得逃避。", "56": "公安机关交通管理部门根据调查处理交通事故检验、鉴定的需要，可以扣留事故车辆、逃逸嫌疑车辆、机动车行驶证、交通事故当事人机动车驾驶证以及其他可以作为证据使用的物品、文书，检验、鉴定后应当立即归还。", "72": "行人、乘车人有下列行为之一的，处十元罚款：\n（一）在机动车道内行走、滞留的；\n（二）跨越、倚坐道路隔离设施的；\n（三）乘坐两轮摩托车未正向骑坐的。\n行人、乘车人有下列行为之一的，处五十元罚款：\n（一）在车行道上拦车、带路或者从事兜售、发送物品等妨碍交通安全活动的；\n（二）机动车在高速公路上行驶，乘车人不按规定使用安全带的；\n（三）扒车、跳车、追车或者抛物击车的。", "73": "非机动车驾驶人有下列行为之一的，处二十元罚款：\n（一）不按交通信号指示通行的；\n（二）不按规定载物的；\n（三）横过道路不按规定通行的；\n（四）在道路上驾驶独轮自行车或者其他禁止上道路行驶的自行车的；\n（五）牵引车辆、攀扶车辆或者被其他车辆牵引的；\n（六）双手离把的；\n（七）违反本办法第五十条第（一）项、第（三）项、第（四）项、第（五）项、第（六）项、第（七）项规定的。\n非机动车驾驶人或者所有人有下列行为之一的，处五十元罚款：\n（一）逆向行驶的；\n（二）进入高速公路、城市快速路或者封闭的机动车专用道路通行的；\n（三）醉酒驾驶、驾驭非机动车的；\n（四）非下肢残疾的人驾驶残疾人机动轮椅车的；\n（五）自行车、人力三轮车加装动力装置的；\n（六）驾驶未经登记或者未悬挂号牌的人力三轮车、电动自行车、残疾人机动轮椅车的；\n（七）使用伪造、变造非机动车号牌、行驶证，或者使用其他非机动车号牌、行驶证的；\n（八）擅自改变电动自行车、残疾人机动轮椅车结构、主要技术参数和性能的。\n有前款第（五）项、第（八）项行为的，由公安机关交通管理部门收缴非法牌证和装置；有前款第（六）项、第（七）项行为的，由公安机关交通管理部门扣留该车辆，当事人提供相应合法证明的，应当及时退还车辆。", "74": "机动车驾驶人有下列情形之一的，处五十元罚款，属于机动车所有人或者管理人责任的，处罚所有人或者管理人：\n（一）不按规定戴安全头盔的；\n（二）不按规定使用安全带的；\n（三）不按规定使用灯光的；\n（四）不按规定鸣喇叭示意或者在禁止鸣喇叭的区域、路段鸣喇叭的；\n（五）驾驶摩托车手离车把或者在车把上悬挂物品的；\n（六）不按规定临时停车影响其他车辆和行人通行的；\n（七）运载超长、宽、高物品未悬挂明显标志的。\n因有前款第（三）项至第（七）项情形之一造成交通事故的，处二百元罚款。", "75": "机动车驾驶人有下列情形之一的，处一百元罚款：\n（一）不按交通标志、标线指示通行的；\n（二）驾驶时不按规定依次交替通行或者在人行横道、网状线区域内停车等候的；\n（三）不按规定车道行驶或者变更车道的；\n（四）路口遇有交通阻塞未依次等候的；\n（五）违反让行规定的；\n（六）违反规定载人的；\n（七）在道路上发生故障妨碍交通又难以移动或者发生交通事故后，不按规定使用警示灯光或者设置警告标志的。\n因有前款情形之一造成交通事故的，处二百元罚款。", "76": "机动车驾驶人有下列情形之一的，处一百五十元罚款：\n（一）不按交通信号灯指示通行的；\n（二）不按规定会车、超车、倒车、掉头或者占用超车道的；\n（三）不按规定停放影响其他车辆和行人通行的；\n（四）违反规定牵引故障机动车或者牵引挂车的；\n（五）运载超限物品不按规定的时间、路线、速度行驶的；\n（六）使用教练车不按指定的路线或者时间在道路上教练的；\n（七）拖拉机驶入大中城市中心城区内道路或者其他禁止通行道路的；\n（八）连续驾驶机动车超过四小时未停车休息或者停车休息时间少于二十分钟的；\n（九）在驾驶证丢失、损毁期间仍驾驶机动车的。\n因有前款第（一）项至第（八）项情形之一造成交通事故的，处二百元罚款。", "77": "机动车驾驶人有下列情形之一的，处二百元罚款，属于机动车所有人或者管理人责任的，处罚所有人或者管理人：\n（一）不按交通警察指挥通行的；\n（二）逆向行驶的；\n（三）在实习期内驾驶公交车、营运载客汽车、正在执行任务的特种车、载有危险物品的机动车或者驾驶的机动车牵引挂车的；\n（四）故意遮挡、污损机动车号牌或者不按规定安装机动车号牌的；\n（五）上道路行驶的机动车未悬挂机动车号牌的；\n（六）服用国家管制的精神药品、麻醉药品或者患有妨碍安全驾驶疾病仍继续驾驶的；\n（七）驾驶安全设施不全或者机件不符合技术标准等有安全隐患的机动车的；\n（八）机动车不按规定参加安全技术检验的；\n（九）违反本办法第七条、第十二条、第十三条、第十四条、第十五条、第十六条、第四十七条、第四十九条第（五）项规定的；\n（十）不按本办法第二十七条规定接受道路交通安全法律、法规和相关知识教育的。\n违反本办法第十六条规定的，除按照前款规定处罚外，公安机关交通管理部门应当强制拆除其非法装置、设备，予以收缴。", "78": "机动车驾驶人在高速公路上驾驶机动车有下列行为之一的，处二百元罚款：\n（一）发生故障或者交通事故后，不按规定使用危险报警闪光灯、设置警告标志或者不按规定拖曳故障车、事故车的；\n（二）从匝道进入或者驶离高速公路时不按规定使用转向灯或者从匝道进入时妨碍已在高速公路内机动车正常行驶的；\n（三）非紧急情况下在应急车道上行驶或者停车的；\n（四）骑、轧车行道分界线或者在路肩上行驶的；\n（五）在匝道、加速车道或者减速车道上超车的；\n（六）驾驶设计最高时速低于七十公里的机动车驶入的；\n（七）正常情况下低于规定最低时速行驶的；\n（八）低能见度气象条件下不按规定行驶的；\n（九）倒车、穿越中央分隔带掉头或者在车道内停车的；\n（十）试车或者学习驾驶机动车的。", "79": "机动车驾驶人驾驶公路客运车辆载客超过额定乘员一人的，处二百元罚款，超过额定乘员未达百分之二十的，每多超一人加处一百元罚款，但最高罚款不得超过五百元；超过额定乘员百分之二十的，处五百元罚款，每多超一人加处一百元罚款，但最高罚款不得超过二千元。", "80": "机动车驾驶人驾驶货运机动车违反规定载客的，按以下标准处以罚款：\n（一）载客人数五人以下的，处五百元罚款；\n（二）载客人数六人以上十人以下的，处一千元罚款；\n（三）载客人数十一人以上的，处二千元罚款。", "81": "机动车驾驶人驾驶货运机动车载物超过行驶证上核定载质量的，按以下标准处以罚款：\n（一）超过核定载质量未达百分之三十的，处二百元罚款；\n（二）超过核定载质量百分之三十以上未达百分之一百的，处五百元罚款；\n（三）超过核定载质量百分之一百以上未达百分之二百的，处一千元罚款；\n（四）超过核定载质量百分之二百以上的，处二千元罚款。", "82": "机动车驾驶人驾驶机动车超过规定时速的，按以下标准处以罚款：\n（一）超过规定时速未达百分之五十的，处二百元罚款；\n（二）超过规定时速百分之五十的，处五百元罚款；每多超五公里，加处二百元罚款，但最高罚款不得超过二千元。\n超过规定时速百分之五十，造成交通事故的，处二千元罚款。", "83": "机动车驾驶人有下列情形之一的，处二百元以上一千元以下罚款：\n（一）驾驶与驾驶证载明的准驾车型不相符合的车辆的；\n（二）驾驶证超过有效期、违法记分达到十二分、被依法扣留或者公告停止使用期间仍驾驶机动车的；\n（三）持境外机动车驾驶证驾驶机动车的。", "85": "机动车维修单位违反本办法第十八条第二款规定的，由交通、农业（农业机械）管理部门责令限期改正，并处一千元以上一万元以下罚款。\n报废机动车回收单位违反本办法第十九条第二款、第三款规定的，由公安机关交通管理部门责令限期改正，并处一千元以上一万元以下罚款。", "86": "违反本办法第三十二条第三款规定，擅自在城市道路两侧设置平面交叉口、通道、出入口的，由城市道路行政管理部门责令限期改正，并处一千元以上一万元以下罚款。", "87": "道路交通违法行为人无正当理由未在规定期限内接受处理的，公安机关交通管理部门可以扣留机动车或者机动车驾驶证。接受处理后，公安机关交通管理部门应当立即返还机动车或者机动车驾驶证。", "92": "应当设置或者应当及时变更交通信号灯、交通标志、标线而没有设置或者没有及时变更或者交通信号灯、交通标志、标线设置错误，致使通行的人员、车辆及其他财产遭受损失的，负有相关职责的单位应当依法承担赔偿责任。", "99": "本办法自2006年6月1日起施行。"}, "校车安全管理条例": {"4": "国务院教育、公安、交通运输以及工业和信息化、质量监督检验检疫、安全生产监督管理等部门依照法律、行政法规和国务院的规定，负责校车安全管理的有关工作。", "17": "取得校车标牌的车辆应当配备统一的校车标志灯和停车指示标志。\n校车未运载学生上道路行驶的，不得使用校车标牌、校车标志灯和停车指示标志。", "18": "禁止使用未取得校车标牌的车辆提供校车服务。", "21": "校车应当配备逃生锤、干粉灭火器、急救箱等安全设备。安全设备应当放置在便于取用的位置，并确保性能良好、有效适用。", "22": "配备校车的学校和校车服务提供者应当按照国家规定做好校车的安全维护，建立安全维护档案，保证校车处于良好技术状态。", "23": "校车驾驶人应当依照本条例的规定取得校车驾驶资格。", "25": "机动车驾驶人未取得校车驾驶资格，不得驾驶校车。禁止聘用未取得校车驾驶资格的机动车驾驶人驾驶校车。", "26": "校车驾驶人应当每年接受公安机关交通管理部门的审验。", "30": "校车运载学生，应当按照国务院公安部门规定的位置放置校车标牌，开启校车标志灯。\n校车运载学生，应当按照经审核确定的线路行驶，遇有交通管制、道路施工以及自然灾害、恶劣气象条件或者重大交通事故等影响道路通行情形的除外。", "32": "校车上下学生，应当在校车停靠站点停靠；未设校车停靠站点的路段可以在公共交通站台停靠。", "33": "校车在道路上停车上下学生，应当靠道路右侧停靠，开启危险报警闪光灯，打开停车指示标志。校车在同方向只有一条机动车道的道路上停靠时，后方车辆应当停车等待，不得超越。", "34": "校车载人不得超过核定的人数，不得以任何理由超员。\n学校和校车服务提供者不得要求校车驾驶人超员、超速驾驶校车。", "35": "载有学生的校车在高速公路上行驶的最高时速不得超过80公里，在其他道路上行驶的最高时速不得超过60公里。\n道路交通安全法律法规规定或者道路上限速标志、标线标明的最高时速低于前款规定的，从其规定。\n载有学生的校车在急弯、陡坡、窄路、窄桥以及冰雪、泥泞的道路上行驶，或者遇有雾、雨、雪、沙尘、冰雹等低能见度气象条件时，最高时速不得超过20公里。", "38": "配备校车的学校、校车服务提供者应当指派照管人员随校车全程照管乘车学生。", "41": "校车驾驶人驾驶校车上道路行驶前，应当对校车的制动、转向、外部照明、轮胎、安全门、座椅、安全带等车况是否符合安全技术要求进行检查，不得驾驶存在安全隐患的校车上道路行驶。\n校车驾驶人不得在校车载有学生时给车辆加油，不得在校车发动机引擎熄灭前离开驾驶座位。", "44": "使用拼装或者达到报废标准的机动车接送学生的，由公安机关交通管理部门收缴并强制报废机动车；对驾驶人处2000元以上5000元以下的罚款，吊销其机动车驾驶证；对车辆所有人处8万元以上10万元以下的罚款，有违法所得的予以没收。", "45": "使用未取得校车标牌的车辆提供校车服务，或者使用未取得校车驾驶资格的人员驾驶校车的，由公安机关交通管理部门扣留该机动车，处1万元以上2万元以下的罚款，有违法所得的予以没收。\n伪造、变造或者使用伪造、变造的校车标牌的，由公安机关交通管理部门收缴伪造、变造的校车标牌，扣留该机动车，处2000元以上5000元以下的罚款。", "46": "不按照规定为校车配备安全设备，或者不按照规定对校车进行安全维护的，由公安机关交通管理部门责令改正，处1000元以上3000元以下的罚款。", "47": "机动车驾驶人未取得校车驾驶资格驾驶校车的，由公安机关交通管理部门处1000元以上3000元以下的罚款，情节严重的，可以并处吊销机动车驾驶证。", "48": "校车驾驶人有下列情形之一的，由公安机关交通管理部门责令改正，可以处200元罚款：\n（一）驾驶校车运载学生，不按照规定放置校车标牌、开启校车标志灯，或者不按照经审核确定的线路行驶；\n（二）校车上下学生，不按照规定在校车停靠站点停靠；\n（三）校车未运载学生上道路行驶，使用校车标牌、校车标志灯和停车指示标志；\n（四）驾驶校车上道路行驶前，未对校车车况是否符合安全技术要求进行检查，或者驾驶存在安全隐患的校车上道路行驶；\n（五）在校车载有学生时给车辆加油，或者在校车发动机引擎熄灭前离开驾驶座位。", "50": "校车载人超过核定人数的，由公安机关交通管理部门扣留车辆至违法状态消除，并依照道路交通安全法律法规的规定从重处罚。", "52": "机动车驾驶人违反本条例规定，不避让校车的，由公安机关交通管理部门处200元罚款。", "53": "未依照本条例规定指派照管人员随校车全程照管乘车学生的，由公安机关责令改正，可以处500元罚款。", "90": "（注：校车条例共五十五条，无第九十条，此处为数据源引用误差。）", "110": "（注：校车条例共五十五条，无第一百一十条。）"}, "机动车驾驶证申领和使用规定": {"41": "申请人在场地和道路上学习驾驶，应当按规定取得学习驾驶证明。学习驾驶证明的有效期为三年，但有效期截止日期不得超过申请年龄条件上限。申请人应当在有效期内完成科目二和科目三考试。未在有效期内完成考试的，已考试合格的科目成绩作废。\n学习驾驶证明可以采用纸质或者电子形式，纸质学习驾驶证明和电子学习驾驶证明具有同等效力。申请人可以通过互联网交通安全综合服务管理平台打印或者下载学习驾驶证明。", "42": "申请人在道路上学习驾驶，应当随身携带学习驾驶证明，使用教练车或者学车专用标识签注的自学用车，在教练员或者学车专用标识签注的指导人员随车指导下，按照公安机关交通管理部门指定的路线、时间进行。\n申请人为自学直考人员的，在道路上学习驾驶时，应当在自学用车上按规定放置、粘贴学车专用标识，自学用车不得搭载随车指导人员以外的其他人员。", "67": "机动车驾驶人身体条件发生变化，不符合所持机动车驾驶证准驾车型的条件，但符合准予驾驶的其他准驾车型条件的，应当在三十日内到机动车驾驶证核发地或者核发地以外的车辆管理所申请降低准驾车型。申请时应当确认申请信息，并提交机动车驾驶人的身份证明、医疗机构出具的有关身体条件的证明。\n机动车驾驶人身体条件发生变化，不符合第十四条第二项规定或者具有第十五条规定情形之一，不适合驾驶机动车的，应当在三十日内到机动车驾驶证核发地车辆管理所申请注销。申请时应当确认申请信息，并提交机动车驾驶人的身份证明和机动车驾驶证。\n机动车驾驶人身体条件不适合驾驶机动车的，不得驾驶机动车。", "69": "机动车驾驶证遗失的，机动车驾驶人应当向机动车驾驶证核发地或者核发地以外的车辆管理所申请补发。申请时应当确认申请信息，并提交机动车驾驶人的身份证明。符合规定的，车辆管理所应当在一日内补发机动车驾驶证。\n机动车驾驶人补领机动车驾驶证后，原机动车驾驶证作废，不得继续使用。\n机动车驾驶证被依法扣押、扣留或者暂扣期间，机动车驾驶人不得申请补发。", "72": "机动车驾驶人应当按照法律、行政法规的规定，定期到公安机关交通管理部门接受审验。\n机动车驾驶人按照本规定第六十三条、第六十四条换领机动车驾驶证时，应当接受公安机关交通管理部门的审验。\n持有大型客车、重型牵引挂车、城市公交车、中型客车、大型货车驾驶证的驾驶人，应当在每个记分周期结束后三十日内到公安机关交通管理部门接受审验。但在一个记分周期内没有记分记录的，免予本记分周期审验。\n持有第三款规定以外准驾车型驾驶证的驾驶人，发生交通事故造成人员死亡承担同等以上责任未被吊销机动车驾驶证的，应当在本记分周期结束后三十日内到公安机关交通管理部门接受审验。\n年龄在70周岁以上的机动车驾驶人发生责任交通事故造成人员重伤或者死亡的，应当在本记分周期结束后三十日内到公安机关交通管理部门接受审验。\n机动车驾驶人可以在机动车驾驶证核发地或者核发地以外的地方参加审验、提交身体条件证明。", "77": "机动车驾驶人在实习期内不得驾驶公共汽车、营运客车或者执行任务的警车、消防车、救护车、工程救险车以及载有爆炸物品、易燃易爆化学物品、剧毒或者放射性等危险物品的机动车；驾驶的机动车不得牵引挂车。\n驾驶人在实习期内驾驶机动车上高速公路行驶，应当由持相应或者包含其准驾车型驾驶证三年以上的驾驶人陪同。其中，驾驶残疾人专用小型自动挡载客汽车的，可以由持有小型自动挡载客汽车以上准驾车型驾驶证的驾驶人陪同。\n在增加准驾车型后的实习期内，驾驶原准驾车型的机动车时不受上述限制。", "81": "机动车驾驶人联系电话、联系地址等信息发生变化的，应当在信息变更后三十日内，向驾驶证核发地车辆管理所备案。\n持有大型客车、重型牵引挂车、城市公交车、中型客车、大型货车驾驶证的驾驶人从业单位等信息发生变化的，应当在信息变更后三十日内，向从业单位所在地车辆管理所备案。", "90": "校车驾驶人应当在每个记分周期结束后三十日内到公安机关交通管理部门接受审验。审验时，应当提交医疗机构出具的有关身体条件的证明，参加不少于三小时的道路交通安全法律法规、交通安全文明驾驶、应急处置等知识学习，并接受交通事故案例警示教育。", "93": "申请人隐瞒有关情况或者提供虚假材料申领机动车驾驶证的，公安机关交通管理部门不予受理或者不予办理，处五百元以下罚款；申请人在一年内不得再次申领机动车驾驶证。\n申请人在考试过程中有贿赂、舞弊行为的，取消考试资格，已经通过考试的其他科目成绩无效，公安机关交通管理部门处二千元以下罚款；申请人在一年内不得再次申领机动车驾驶证。\n申请人以欺骗、贿赂等不正当手段取得机动车驾驶证的，公安机关交通管理部门收缴机动车驾驶证，撤销机动车驾驶许可，处二千元以下罚款；申请人在三年内不得再次申领机动车驾驶证。\n组织、参与实施前三款行为之一牟取经济利益的，由公安机关交通管理部门处违法所得三倍以上五倍以下罚款，但最高不超过十万元。\n申请人隐瞒有关情况或者提供虚假材料申请校车驾驶资格的，公安机关交通管理部门不予受理或者不予办理，处五百元以下罚款；申请人在一年内不得再次申请校车驾驶资格。申请人以欺骗、贿赂等不正当手段取得校车驾驶资格的，公安机关交通管理部门撤销校车驾驶资格，处二千元以下罚款；申请人在三年内不得再次申请校车驾驶资格。", "94": "申请人在教练员或者学车专用标识签注的指导人员随车指导下，使用符合规定的机动车学习驾驶中有道路交通安全违法行为或者发生交通事故的，按照《道路交通安全法实施条例》第二十条规定，由教练员或者随车指导人员承担责任。", "99": "机动车驾驶人有下列行为之一的，由公安机关交通管理部门处二百元以上五百元以下罚款：\n（一）机动车驾驶证被依法扣押、扣留或者暂扣期间，采用隐瞒、欺骗手段补领机动车驾驶证的；\n（二）机动车驾驶人身体条件发生变化不适合驾驶机动车，仍驾驶机动车的；\n（三）逾期不参加审验仍驾驶机动车的。\n有第一款第一项、第二项规定情形之一的，由公安机关交通管理部门收回机动车驾驶证。", "100": "机动车驾驶人参加审验教育时在签注学习记录、学习过程中弄虚作假的，相应学习记录无效，重新参加审验学习，由公安机关交通管理部门处一千元以下罚款。\n代替实际机动车驾驶人参加审验教育的，由公安机关交通管理部门处二千元以下罚款。\n组织他人实施前两款行为之一，有违法所得的，由公安机关交通管理部门处违法所得三倍以下罚款，但最高不超过二万元；没有违法所得的，由公安机关交通管理部门处二万元以下罚款。", "95": "申请人在道路上学习驾驶时，有下列情形之一的，由公安机关交通管理部门对教练员或者随车指导人员处二十元以上二百元以下罚款：\n（一）未按照公安机关交通管理部门指定的路线、时间进行的；\n（二）未按照本规定第四十二条规定放置、粘贴学车专用标识的。", "96": "申请人在道路上学习驾驶时，有下列情形之一的，由公安机关交通管理部门对教练员或者随车指导人员处二百元以上五百元以下罚款：\n（一）未使用符合规定的机动车的；\n（二）自学用车搭载随车指导人员以外的其他人员的。", "97": "申请人在道路上学习驾驶时，有下列情形之一的，由公安机关交通管理部门按照《道路交通安全法》第九十九条第一款第一项规定予以处罚：\n（一）未取得学习驾驶证明的；\n（二）没有教练员或者随车指导人员的；\n（三）由不符合规定的人员随车指导的。\n将机动车交由有前款规定情形之一的申请人驾驶的，由公安机关交通管理部门按照《道路交通安全法》第九十九条第一款第二项规定予以处罚。", "98": "机动车驾驶人有下列行为之一的，由公安机关交通管理部门处二十元以上二百元以下罚款：\n（一）机动车驾驶人补换领机动车驾驶证后，继续使用原机动车驾驶证的；\n（二）在实习期内驾驶机动车不符合第七十七条规定的；\n（三）持有大型客车、重型牵引挂车、城市公交车、中型客车、大型货车驾驶证的驾驶人，未按照第八十一条规定申报变更信息的。\n有第一款第一项规定情形的，由公安机关交通管理部门收回原机动车驾驶证。"}, "机动车登记规定": {"16": "已注册登记的机动车有下列情形之一的，机动车所有人应当向登记地车辆管理所申请变更登记：\n（一）改变车身颜色的；\n（二）更换发动机的；\n（三）更换车身或者车架的；\n（四）因质量问题更换整车的。", "18": "机动车所有人的住所迁出车辆管理所管辖区域的，应当办理转移登记。", "23": "已注册登记的机动车有下列情形之一的，机动车所有人应当向登记地车辆管理所申请注销登记：\n（一）机动车灭失的；\n（二）机动车因故不在我国境内使用的；\n（三）因质量问题退车的。", "25": "机动车登记证书、号牌、行驶证灭失、丢失或者损毁的，机动车所有人应当向登记地车辆管理所申请补领、换领。", "47": "机动车登记证书、号牌、行驶证的式样由国务院公安部门规定并监制。", "51": "机动车号牌、行驶证灭失、丢失或者损毁的，机动车所有人应当向登记地车辆管理所申请补领、换领。", "52": "机动车所有人申请检验合格标志，应当提交行驶证、机动车交通事故责任强制保险凭证、机动车安全技术检验合格证明。", "54": "机动车所有人可以在机动车检验有效期满前三个月内向登记地车辆管理所申请检验合格标志。", "78": "有下列情形之一的，由公安机关交通管理部门处警告或者二百元以下罚款：\n（一）机动车喷涂、粘贴标识或者车身广告，影响安全驾驶的；\n（二）机动车不按照规定期限进行安全技术检验的。", "79": "机动车所有人违反本规定，不按照规定办理变更登记、转移登记、注销登记的，由公安机关交通管理部门处警告或者二百元以下罚款。", "80": "机动车驾驶人有下列情形之一的，由公安机关交通管理部门处警告或者二百元以下罚款：\n（一）机动车驾驶人不按照规定悬挂机动车号牌的；\n（二）机动车驾驶人故意遮挡、污损机动车号牌的。", "81": "伪造、变造或者使用伪造、变造的机动车登记证书、号牌、行驶证的，由公安机关交通管理部门予以收缴，依法扣留该机动车，处十五日以下拘留，并处二千元以上五千元以下罚款；构成犯罪的，依法追究刑事责任。"}, "道路交通安全违法行为记分管理办法": {"11": "机动车驾驶人有下列交通违法行为之一，一次记3分：\n（一）驾驶校车、公路客运汽车、旅游客运汽车、7座以上载客汽车以外的其他载客汽车载人超过核定人数百分之二十以上未达到百分之五十的；\n（二）驾驶校车、中型以上载客载货汽车、危险物品运输车辆以外的机动车在高速公路、城市快速路以外的道路上行驶超过规定时速百分之二十以上未达到百分之五十的；\n（三）驾驶机动车在高速公路或者城市快速路上不按规定车道行驶的；\n（四）驾驶机动车不按规定超车、让行，或者在高速公路、城市快速路以外的道路上逆行的；\n（五）驾驶机动车遇前方机动车停车排队或者缓慢行驶时，借道超车或者占用对面车道、穿插等候车辆的；\n（六）驾驶机动车有拨打、接听手持电话等妨碍安全驾驶的行为的；\n（七）驾驶机动车行经人行横道不按规定减速、停车、避让行人的；\n（八）驾驶机动车不按规定避让校车的；\n（九）驾驶载货汽车载物超过最大允许总质量百分之三十以上未达到百分之五十的，或者违反规定载客的；\n（十）驾驶不按规定安装机动车号牌的机动车上道路行驶的。", "12": "机动车驾驶人有下列交通违法行为之一，一次记1分：\n（一）驾驶校车、中型以上载客载货汽车、危险物品运输车辆在高速公路、城市快速路以外的道路上行驶超过规定时速百分之十以上未达到百分之二十的；\n（二）驾驶机动车不按规定会车，或者在高速公路、城市快速路以外的道路上不按规定倒车、掉头的；\n（三）驾驶机动车不按规定使用灯光的；\n（四）驾驶机动车违反禁令标志、禁止标线指示的；\n（五）驾驶机动车载货长度、宽度、高度超过规定的；\n（六）驾驶载货汽车载物超过最大允许总质量未达到百分之三十的；\n（七）驾驶未按规定定期进行安全技术检验的机动车上道路行驶的。", "17": "机动车驾驶人在一个记分周期内累积记分满12分的，公安机关交通管理部门应当扣留其机动车驾驶证，开具强制措施凭证，并送达满分教育通知书，通知机动车驾驶人参加满分学习、考试。", "30": "机动车驾驶人请他人代为接受交通违法行为处罚和记分并支付经济利益的，由公安机关交通管理部门处所支付经济利益三倍以下罚款，但最高不超过五万元；同时，依法对原交通违法行为作出处罚。\n代替实际机动车驾驶人接受交通违法行为处罚和记分牟取经济利益的，由公安机关交通管理部门处违法所得三倍以下罚款，但最高不超过五万元。", "31": "机动车驾驶人参加满分教育时在签注学习记录、满分学习考试中弄虚作假的，相应学习记录、考试成绩无效，由公安机关交通管理部门处一千元以下罚款。"}, "浙江省电动自行车管理条例": {"10": "电动自行车经公安机关交通管理部门登记，取得行驶证、号牌，方可上道路行驶。\n禁止伪造、变造或者买卖电动自行车行驶证、号牌。", "17": "驾驶电动自行车，应当遵守道路交通安全法律法规关于道路通行安全的规定。\n电动自行车驾驶人及搭载人应当佩戴安全头盔。\n电动自行车搭载六周岁以下未成年人的，应当在后座使用儿童座椅。", "23": "伪造、变造或者买卖电动自行车行驶证、号牌的，由公安机关交通管理部门处二千元以上二万元以下罚款，收缴伪造、变造或者买卖的电动自行车行驶证、号牌。\n驾驶无行驶证、号牌的电动自行车上道路行驶的，由公安机关交通管理部门对驾驶人处五十元罚款，扣留车辆。", "25": "违反本条例规定，驾驶人或者搭载人未佩戴安全头盔，或者搭载六周岁以下未成年人未使用儿童座椅的，由公安机关交通管理部门处以警告或者二十元以上五十元以下罚款。", "26": "驾驶改装、拼装、加装的电动自行车上道路行驶的，由公安机关交通管理部门收缴拼装车辆，责令恢复限速装置、拆除加装或者改装的装置；处五十元以上五百元以下罚款。"}, "道路交通安全违法行为处理程序规定": {"24": "公安机关交通管理部门及其交通警察在执法过程中，依法可以采取下列行政强制措施：\n（一）扣留车辆；\n（二）扣留机动车驾驶证；\n（三）拖移机动车；\n（四）检验体内酒精、国家管制的精神药品、麻醉药品含量；\n（五）收缴物品；\n（六）法律、法规规定的其他行政强制措施。", "25": "采取本规定第二十四条第（一）、（二）、（四）、（五）项行政强制措施，应当按照下列程序实施：\n（一）口头告知违法行为人或者机动车所有人、管理人违法行为的基本事实、拟作出行政强制措施的种类、依据及其依法享有的权利；\n（二）听取当事人的陈述和申辩；\n（三）制作行政强制措施凭证，并告知当事人在十五日内到指定地点接受处理。", "27": "有下列情形之一的，依法扣留车辆：\n（一）上道路行驶的机动车未悬挂机动车号牌，未放置检验合格标志、保险标志，或者未随车携带机动车行驶证、驾驶证的；\n（二）有伪造、变造或者使用伪造、变造的机动车登记证书、号牌、行驶证、检验合格标志、保险标志、驾驶证或者使用其他车辆的机动车登记证书、号牌、行驶证、检验合格标志、保险标志嫌疑的；\n（三）未按照国家规定投保机动车交通事故责任强制保险的；\n（四）公路客运车辆或者货运机动车超载的。", "31": "有下列情形之一的，依法扣留机动车驾驶证：\n（一）饮酒后驾驶机动车的；\n（二）将机动车交由未取得机动车驾驶证或者机动车驾驶证被吊销、暂扣的人驾驶的；\n（三）机动车行驶超过规定时速百分之五十的；\n（四）驾驶有拼装或者达到报废标准嫌疑的机动车上道路行驶的；\n（五）在一个记分周期内累积记分达到十二分的。", "33": "违反机动车停放、临时停车规定，驾驶人不在现场或者虽在现场但拒绝立即驶离，妨碍其他车辆、行人通行的，公安机关交通管理部门及其交通警察可以将机动车拖移至不妨碍交通的地点或者公安机关交通管理部门指定的地点。"}, "危险化学品安全管理条例": {"49": "运输危险化学品，应当根据危险化学品的危险特性采取相应的安全防护措施，并配备必要的防护用品和应急救援器材。", "88": "使用安全技术条件不符合国家标准要求的车辆运输危险化学品的，由公安机关责令改正，处5万元以上10万元以下的罚款；构成违反治安管理行为的，依法给予治安管理处罚。"}, "生态环境法典": {"576": "（生态环境法典相关条文，涉及机动车排放污染防治。具体内容以正式公布文本为准。）", "577": "（生态环境法典相关条文，涉及机动车排放污染防治。具体内容以正式公布文本为准。）", "578": "（生态环境法典相关条文，涉及机动车排放污染防治。具体内容以正式公布文本为准。）", "66": "（生态环境法典相关条文，具体内容以正式公布文本为准。）"}, "行政处罚法": {"57": "违法事实确凿并有法定依据，对公民处以二百元以下、对法人或者其他组织处以三千元以下罚款或者警告的行政处罚的，可以当场作出行政处罚决定。法律另有规定的，从其规定。"}, "公安机关办理行政案件程序规定": {"107": "（公安机关办理行政案件程序规定相关条文，具体内容以正式公布文本为准。）"}, "杭州市道路交通安全管理条例": {"25": "机动车所有人、管理人、驾驶人应当遵守下列规定：\n（一）不得转借或者使用他人机动车驾驶证；\n（二）不得违反规定进入非机动车道、人行道行驶；\n（三）载货的机动车在行驶过程中应当防止货物脱落、泄漏、遗撒。", "68": "道路作业单位或者作业人员在道路上作业违反本条例第二十五条规定，影响道路交通安全的，由公安机关交通管理部门责令其停止违法行为，可以处五百元以上二千元以下罚款。"}, "浙江省快递业促进条例": {"13": "快递从业人员应当遵守道路交通安全法律、法规，文明驾驶、安全作业。", "15": "快递经营企业应当对快递从业人员进行道路交通安全教育培训。", "46": "违反本条例规定，快递从业人员违反道路交通安全法律、法规的，由公安机关交通管理部门依法处理。"}, "浙江省机动车排气污染防治条例": {"26": "（浙江省机动车排气污染防治条例相关条文，具体内容以正式公布文本为准。）", "32": "（浙江省机动车排气污染防治条例相关条文，具体内容以正式公布文本为准。）"}, "剧毒化学品购买和公路运输许可证件管理办法": {"18": "通过公路运输剧毒化学品的，应当依照本办法的规定申请领取剧毒化学品公路运输通行证。"}, "杭州市智能网联车辆测试与应用促进条例": {"18": "（杭州市智能网联车辆测试与应用促进条例相关条文，具体内容以正式公布文本为准。）"}, "道路交通事故处理程序规定": {"19": "机动车发生交通事故，造成道路、供电、通讯等设施损毁的，驾驶人应当报警等候处理，不得驶离。", "39": "因收集证据的需要，公安机关交通管理部门可以扣留事故车辆，并开具行政强制措施凭证。扣留的车辆应当妥善保管。"}, "大气污染防治法": {"113": "违反本法规定，机动车、非道路移动机械生产企业对发动机、污染控制装置弄虚作假、以次充好，冒充排放检验合格产品出厂销售的，由省级以上人民政府环境保护主管部门责令停产整顿，没收违法所得，并处货值金额一倍以上三倍以下的罚款。"}, "杭州市机动车停车场库管理办法": {"30": "（杭州市机动车停车场（库）管理办法相关条文，具体内容以正式公布文本为准。）", "42": "（杭州市机动车停车场（库）管理办法相关条文，具体内容以正式公布文本为准。）"}, "杭州市残疾人机动轮椅车管理办法": {"12": "（杭州市残疾人机动轮椅车管理办法相关条文，具体内容以正式公布文本为准。）", "25": "（杭州市残疾人机动轮椅车管理办法相关条文，具体内容以正式公布文本为准。）"}, "舟山市文明行为促进条例": {"38": "（舟山市文明行为促进条例相关条文，具体内容以正式公布文本为准。）"}, "关于做好国家电动自行车新标准实施前过渡期内有关工作的通知": {"0": "（该文件为过渡期通知，具体内容以正式公布文本为准。）"}};

function normalize(s){return String(s||"").toLowerCase();}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}

// 字段顺序（隐藏国标/有效期/CSBJ等）
const ORDER=["违法记分","罚款金额","暂扣","拘留","警告","暂扣驾驶证","吊销驾驶证","撤销驾驶许可","撤销机动车登记","强制措施","强制措施依据","违法规定","违法条文"];

// 合并金额/时限：3行 -> 1行
function mergeRange(r){
  // 通用合并：下限/上限/默认 三字段 -> "下限~上限；默认"
  function combine(lowKey, highKey, defKey, newKey, unit){
    const low=r[lowKey], high=r[highKey], def=r[defKey];
    const parts=[];
    if(low && high){
      parts.push(low+"~"+high);
    }else if(low){
      parts.push(low);
    }else if(high){
      parts.push(high);
    }
    if(def && !(low && high && def===low)){ // 默认值与区间相同时不重复
      if(def!==low && def!==high) parts.push(def);
    }
    if(parts.length){r[newKey]=parts.join("；")+(unit?unit:"");}
    delete r[lowKey];delete r[highKey];delete r[defKey];
  }
  combine("罚款金额下限","罚款金额上限","默认金额","罚款金额","元");
  combine("暂扣月数（下限）","暂扣月数（上限）","暂扣月数（默认）","暂扣"," 个月");
  combine("拘留时间（下限）","拘留时间（上限）","拘留时间（默认）","拘留"," 日");
}

// 隐藏字段（含 code，不展示代码这一栏）
const HIDDEN=["国标","有效期始","有效期止","CSBJ","BJCSBJ","code","name","content","_tags","强制措施类型","罚款","行政拘留"];

function buildDetail(r){
  const c=JSON.parse(JSON.stringify(r));
  mergeRange(c);
  const entries=[];
  const seen=new Set();
  // 按 ORDER 顺序
  for(const k of ORDER){
    const v=c[k];
    if(v!==undefined&&v!==null&&String(v).trim()!==""){
      seen.add(k);entries.push([k,v]);
    }
  }
  // 剩余字段
  for(const k in c){
    if(k.startsWith("_"))continue;
    if(seen.has(k))continue;
    if(HIDDEN.includes(k))continue;
    const v=c[k];
    if(v===undefined||v===null||String(v).trim()==="")continue;
    entries.push([k,v]);
  }
  let out="";
  for(const [k,v] of entries){
    const isLaw=(k==="违法规定"||k==="违法条文"||k==="强制措施依据");
    const isHl=(k==="强制措施类型"||k==="强制措施"||k==="强制措施依据");
    let valHtml;
    if(isLaw){
      valHtml=renderLawRefs(String(v));
    }else{
      valHtml=esc(String(v));
    }
    const cls=(isHl?' hl':'')+(isLaw?'':'');
    out+='<div class="d-row"><div class="d-key">'+esc(k)+'</div><div class="d-val'+cls+'">'+valHtml+'</div></div>';
  }
  return out;
}

// 解析条文引用，生成可点击元素（点击弹窗展示条文具体内容）
function renderLawRefs(text){
  let html=esc(text);
  const re=/《([^》]+)》([^《]*)/g;
  html=html.replace(re,function(m,law,rest){
    let r='《'+law+'》';
    r+=rest.replace(/第([一二三四五六七八九十百零]+)条/g,function(mm,art){
      return '<span class="law-link" data-law="'+escAttr(law)+'" data-art="'+escAttr(art)+'">'+mm+'</span>';
    });
    return r;
  });
  return html;
}

function escAttr(s){return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

// 法律名归一化：去书名号/前缀/错字，得到 laws.json 的 key
function normalizeLaw(law){
  let s=String(law||'');
  s=s.replace(/&lt;|&gt;|&amp;/g,'');
  s=s.replace(/[〈〉＜＞<>]/g,'');
  s=s.replace(/中华人民共和国/g,'').replace(/中国/g,'');
  s=s.replace(/\s+/g,'');
  // 数据源错字/多字修正
  s=s.replace(/中华人民共国/g,'').replace(/道路安全法/g,'道路交通安全法');
  s=s.replace(/省省/g,'省');
  return s;
}

// 中文数字转阿拉伯数字
function cnToNum(s){
  const map={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  const str=String(s);
  if(/^\d+$/.test(str))return str;
  let total=0,cur=0;
  for(const ch of str){
    if(ch==='十'){cur=cur===0?10:cur*10;total+=cur;cur=0;}
    else if(ch==='百'){cur=(cur===0?1:cur)*100;total+=cur;cur=0;}
    else{cur=map[ch]||0;}
  }
  total+=cur;
  return String(total);
}

// 打开法条弹窗，展示条文具体内容
function openLaw(law, art){
  const lawKey=normalizeLaw(law);
  const artKey=cnToNum(art);
  const title='《'+law+'》第'+art+'条';
  let content=null;
  const lawObj=LAWS[lawKey];
  if(lawObj){
    content=lawObj[artKey];
  }
  document.getElementById('sheetTitle').textContent=title;
  if(content){
    document.getElementById('sheetBody').textContent=content;
    document.getElementById('sheetNote').style.display='block';
  }else{
    document.getElementById('sheetBody').textContent='该条文具体内容暂未收录。\n\n可通过「国家法律法规数据库」(flk.npc.gov.cn) 查询《'+law+'》第'+art+'条原文。';
    document.getElementById('sheetNote').style.display='none';
  }
  document.getElementById('mask').classList.add('show');
}

// 打开裁量基准弹窗
function openCaizhi(idx){
  const c=CAIZHI[idx];
  if(!c)return;
  document.getElementById('sheetTitle').textContent='裁量基准';
  let html='<div style="font-size:15px;font-weight:700;margin-bottom:4px;color:#1a1a1a">'+esc(c.name)+'</div>';
  html+='<div style="font-size:12px;color:#9ca3af;margin-bottom:8px">裁量情节数 = 从重情节 − 从轻情节</div>';
  for(const it of c.items){
    html+='<div class="cz-item">';
    if(it.qj)html+='<div class="cz-qj">'+esc(it.qj)+'</div>';
    if(it.bz)html+='<div class="cz-bz">'+esc(it.bz)+'</div>';
    html+='</div>';
  }
  document.getElementById('sheetBody').innerHTML=html;
  document.getElementById('sheetNote').style.display='none';
  document.getElementById('mask').classList.add('show');
}

// 打开特殊补充说明弹窗（如 80611 处罚裁量说明）
function openExtra(extra){
  if(!extra)return;
  document.getElementById('sheetTitle').textContent=extra.title||'补充说明';
  let html='';
  for(const sec of (extra.sections||[])){
    if(sec.heading)html+='<div style="font-size:14px;font-weight:700;margin:10px 0 6px;color:#1a1a1a">'+esc(sec.heading)+'</div>';
    for(const it of (sec.items||[])){
      html+='<div style="font-size:14px;line-height:1.7;color:#333;margin:4px 0;padding-left:8px">'+esc(it)+'</div>';
    }
  }
  document.getElementById('sheetBody').innerHTML=html;
  document.getElementById('sheetNote').style.display='none';
  document.getElementById('mask').classList.add('show');
}

function render(rows){
  const list=document.getElementById("list");
  const cnt=document.querySelector(".count");
  if(cnt)cnt.remove();
  if(rows.length===0){
    list.innerHTML='<div class="empty"><div class="big">🔍</div><div>未查询到匹配的违法代码</div><div style="font-size:13px;color:#b0b4ba">请尝试更换关键词或标签</div></div>';
    return;
  }
  let html='<div class="count">共 '+rows.length+' 条结果</div>';
  for(const r of rows){
    const tags=r._tags||[];
    const name=r.name||r.content||"";
    const kou=tags.includes('kz');
    let badges='';
    if(kou)badges+='<span class="badge kou">扣留/强制措施</span>';
    html+='<div class="card"><div class="row1">'
        +'<span class="code">'+esc(r.code||"")+'</span>'
        +'<span class="name">'+esc(name)+'</span>'
        +'</div>';
    if(badges)html+='<div style="margin-top:8px">'+badges+'</div>';
    html+='<div class="detail"><div class="detail-grid">'+buildDetail(r)+'</div></div>';
    if(r._cz!==undefined&&r._cz>=0){
      html+='<button class="cz-btn" data-cz="'+r._cz+'">查看裁量基准</button>';
    }
    if(r._extra){
      html+='<button class="cz-btn" data-extra="'+escAttr(r.code||'')+'">查看处罚裁量说明</button>';
    }
    html+='</div>';
  }
  list.innerHTML=html;
}

function query(){
  const kw=normalize(document.getElementById("kw").value.trim());
  const f=document.querySelector(".tag.active").dataset.f;
  // 首页空态：无关键词且无标签筛选时，展示交警 logo 占位
  if(!kw && !f){
    const list=document.getElementById("list");
    list.innerHTML='<div class="hero">'
      +'<div class="logo"><svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">'
      +'<circle cx="24" cy="24" r="22" fill="none" stroke="#fff" stroke-width="2.5"/>'
      +'<path d="M14 32 L14 20 Q14 13 24 13 Q34 13 34 20 L34 32" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>'
      +'<path d="M14 22 L10 22 M34 22 L38 22" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>'
      +'<circle cx="24" cy="18" r="2.4" fill="#fff"/>'
      +'<path d="M16 26 L32 26" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>'
      +'<path d="M24 26 L24 30" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>'
      +'</svg></div>'
      +'<div class="t1">浙江省交通违法代码查询</div>'
      +'<div class="t2">输入违法代码或名称关键词进行查询<br>或点击上方标签查看对应类别</div>'
      +'</div>';
    return;
  }
  let rows=DATA;
  if(kw){
    rows=rows.filter(r=>normalize(r.code).includes(kw)||normalize(r.name).includes(kw)||normalize(r.content).includes(kw));
  }
  if(f){
    rows=rows.filter(r=>(r._tags||[]).includes(f));
  }
  render(rows);
}

// 标签切换
document.querySelectorAll(".tag").forEach(t=>{
  t.addEventListener("click",function(){
    document.querySelectorAll(".tag").forEach(x=>x.classList.remove("active"));
    this.classList.add("active");
    query();
  });
});

document.getElementById("kw").addEventListener("input",query);

// 法条点击（事件委托）
document.getElementById("list").addEventListener("click",function(e){
  const el=e.target.closest(".law-link");
  if(el){
    openLaw(el.dataset.law, el.dataset.art);
    return;
  }
  const cz=e.target.closest(".cz-btn");
  if(cz){
    if(cz.dataset.cz!==undefined){
      openCaizhi(parseInt(cz.dataset.cz,10));
    }else if(cz.dataset.extra){
      const rec=DATA.find(x=>String(x.code||'')===cz.dataset.extra);
      openExtra(rec&&rec._extra);
    }
  }
});
document.getElementById("mask").addEventListener("click",function(e){
  if(e.target===this||e.target.id==="sheetClose"){
    this.classList.remove("show");
  }
});

query();
</script>

</html>
